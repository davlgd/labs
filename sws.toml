# Static Web Server (SWS) configuration — loaded automatically from ./sws.toml
# https://static-web-server.net/v2/features/url-redirects/
#
# Migration redirects: labs.davlgd.fr (AstroPaper) -> labs.davlgd.com (Verne).
# Both hostnames point at this app; the .fr one only ever 301s to the .com.
# A couple of rules below also apply to the .com itself (see the feed rename).
# Post and tag slugs are unchanged, so the catch-all at the bottom covers most
# of the site. Everything above it is a path that moved or disappeared.
#
# Glob semantics, verified against SWS 2.43:
#   `{*}` / `{**}` capture ONE path segment; only bare `**` crosses `/`.
#   `$0` is the full match (leading slash included), `$1`.. are the groups.
#   There is no optional-trailing-slash pattern: `{,/}` requires the slash and
#   `*` never matches `/`. Paths whose target does not exist verbatim on the
#   new site are therefore listed in both forms.
#
# Rules are evaluated in order: the catch-all MUST stay last.

[advanced]

# Feed was renamed: AstroPaper served /rss.xml, Verne serves /index.xml
[[advanced.redirects]]
host = "labs.davlgd.fr"
source = "/rss.xml"
destination = "https://labs.davlgd.com/index.xml"
kind = 301

# Same rename on the new domain: old feed URLs still land on the current feed
[[advanced.redirects]]
host = "labs.davlgd.com"
source = "/rss.xml"
destination = "https://labs.davlgd.com/index.xml"
kind = 301

# AstroPaper split its sitemap; Verne emits a single one
[[advanced.redirects]]
host = "labs.davlgd.fr"
source = "/sitemap-index.xml"
destination = "https://labs.davlgd.com/sitemap.xml"
kind = 301

